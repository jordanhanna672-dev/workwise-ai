name: CI

# This file MUST live at .github/workflows/ci.yml for GitHub to see it.
# See GETTING_STARTED_GITHUB.md for how to create the ".github" folder
# on a Mac, since Finder hides/blocks folders that start with a dot.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint (syntax check)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build check (server boots without crashing)
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl -sf http://localhost:3000/ > /dev/null
          curl -sf http://localhost:3000/api/tasks > /dev/null
          kill $SERVER_PID
